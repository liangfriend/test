<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Scroll Hide Header</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 2000px;
            font-family: sans-serif;
        }

        /* 顶部返回栏 */
        .header {
            width: 100%;
            height: 100px;
            background: #3498db;
            color: white;
            top:0;
            display: flex;
            position: fixed;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        /* 隐藏 header 的样式 */
        .header.hidden {
            transform: translateY(-100%);
        }

        .content {
            margin-top: 60px;
            padding: 20px;
        }
    </style>
</head>
<body>
   <div class="header" id="header">返回栏</div>
    <div>
        <div class="content">
            <p>往下滚动试试，返回栏会在上滑时隐藏，在任意下滑时立即显示。</p>
            <p style="margin-top: 1500px;">到底啦～</p>
        </div>
    </div>
<script>
    const header = document.getElementById('header');
    let preScrollY = 0
    let transformY  = 0
    window.addEventListener('scroll', (e) => {
        const currentScroll = window.scrollY;
        
        const scrollOffset = currentScroll - preScrollY
        console.log(scrollOffset)
        transformY=Math.min(0,Math.max(-100,transformY-scrollOffset))
        // marginTop替代
        header.style.transform  =`translate(0px,${transformY}px)`
        preScrollY = currentScroll
}, { passive: true });
</script>
</body>
</html>
