<body>
    <div style="margin-bottom: 2rem;"><button onclick="syncSpeed(-0.2)">同步更改速度-</button>
        <button onclick="syncSpeed(0.2)">同步更改速度+</button></div>
    
    <button onclick="changeSpeedByDuration(-0.2)">更改速度-</button>
    <button onclick="changeSpeedByDuration(0.2)">更改速度+</button>
    <div class="item">
        <div class="rotate stick" id="stick2"></div>
        普通动画，更改duration会卡顿
    </div>
    <button onclick="changeSpeedByLogic(-0.2)">更改速度-</button>
    <button onclick="changeSpeedByLogic(0.2)">更改速度+</button>
    <div class="item">
        <div class="stick" id="stick"></div>
        通过算法实现平滑更改速度
    </div>
</body>

<script>
let animationFrameId = null;
let lastTime = null;
let speedFactor = 1.0; // 默认速度倍率
const maxAngle = 90;   // 最大角度
let currentAngle = 0;
let direction = 1;     // 当前摆动方向：1 = 向右，-1 = 向左
let baseSpeed = 180; // 每秒角度速度（度/秒） -> 决定摆动频率

function animatePendulumLinear(time) {
    if (!lastTime) lastTime = time;
    const deltaTime = (time - lastTime) / 1000; // 秒
    lastTime = time;

    const angleSpeed = baseSpeed / speedFactor; // 当前角速度（度/秒）
    currentAngle += direction * angleSpeed * deltaTime;

    if (currentAngle >= maxAngle) {
        currentAngle = maxAngle;
        direction = -1;
    } else if (currentAngle <= 0) {
        currentAngle = 0;
        direction = 1;
    }

    document.getElementById("stick").style.transform = `rotate(${currentAngle}deg)`;

    animationFrameId = requestAnimationFrame(animatePendulumLinear);
}

requestAnimationFrame(animatePendulumLinear);

function changeSpeedByLogic(delta) {
    speedFactor += delta;
    console.log("当前速度倍率:", speedFactor.toFixed(2));
}

function changeSpeedByDuration(offset) {
    const dom = document.getElementById('stick2');
    let duration = parseFloat(getComputedStyle(dom).animationDuration);
    duration = duration + offset
    dom.style.animationDuration = duration + 's';
    console.log("动画duration:", dom.style.animationDuration);
}

function syncSpeed(speed) {
    changeSpeedByDuration(speed)
    changeSpeedByLogic(speed)

}
</script>

<style>
    .item {
        height: 300px;
        width: 300px;
        border: 1px solid black;
        margin-bottom: 20px;
        direction: rtl;
    }

    .stick {
        height: 200px;
        width: 10px;
        background-color: black;
        transform-origin: 0 0;
    }

    .rotate {
        transform-origin: 0 0;
        animation-name: infiniteRotate;
        animation-duration: 1s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }

    @keyframes infiniteRotate {
        0% {
            transform: rotate(0deg);
        }
        50% {
            transform: rotate(90deg);
        }
        100% {
            transform: rotate(0deg);
        }
    }
</style>
