<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>琴键 · 重金属</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #0e1015; color: #eee; padding: 24px; min-height: 100vh; }
    h1 { font-size: 1.2rem; margin-bottom: 8px; }
    .desc { color: #999; font-size: 0.9rem; margin-bottom: 24px; }
    .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin-bottom: 28px; padding: 16px; background: #1a1e26; border-radius: 10px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: #bbb; }
    input[type="number"] { width: 88px; padding: 6px 8px; border: 1px solid #444; border-radius: 6px; background: #12151c; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    .card { background: #1a1e26; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .card h3 { font-size: 0.9rem; color: #ccc; font-weight: 500; }
    .key-wrap { display: flex; align-items: flex-end; justify-content: center; min-height: 140px; padding: 12px; background: #06080c; border-radius: 8px; width: 100%; }
    .demo { margin-top: 32px; padding: 24px; background: #1a1e26; border-radius: 12px; }
    .demo h2 { font-size: 1rem; margin-bottom: 16px; }
    .keyboard { position: relative; display: inline-flex; align-items: flex-start; user-select: none; }
    .white-row { display: flex; align-items: flex-start; }
    .black-row { position: absolute; top: 0; left: 0; width: 100%; height: 60%; pointer-events: none; }
    .black-slot { position: absolute; top: 0; pointer-events: auto; cursor: pointer; transform: translateX(-50%); }
    .white-slot { cursor: pointer; line-height: 0; flex-shrink: 0; }
    .white-slot svg, .black-slot svg { display: block; }
    .size-tag { font-size: 0.75rem; color: #777; font-family: monospace; }
  </style>
</head>
<body>
  <h1>琴键 · 重金属</h1>
  <p class="desc">抛光金属：多段反射高光带 + 斜向镜面高光。白键默认 20×100；黑键 = 白键 × 0.6。</p>

  <div class="controls">
    <label>白键宽 <input type="number" id="whiteW" value="20" min="8" max="80"></label>
    <label>白键高 <input type="number" id="whiteH" value="100" min="40" max="300"></label>
    <label>黑键比例 <input type="number" id="blackRatio" value="0.6" min="0.3" max="0.9" step="0.05"></label>
  </div>

  <div class="grid" id="showcase"></div>
  <div class="demo">
    <h2>交互演示（点击按下）</h2>
    <div class="keyboard" id="keyboard"></div>
  </div>

  <script>
    function getKeySizes(whiteW = 20, whiteH = 100, blackRatio = 0.6) {
      return { white: { w: whiteW, h: whiteH }, black: { w: whiteW * blackRatio, h: whiteH * blackRatio }, blackRatio }
    }
    function uid(p) { return p + Math.random().toString(36).slice(2, 8) }

    /* 白键：抛光不锈钢，横向反射带 + 斜镜面高光 */
    function whiteKeySvg(w, h) {
      const id = uid('mw')
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 20 100" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <!-- 横向反射带：模拟柱面抛光金属 -->
    <linearGradient id="${id}-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#aeb6c2"/>
      <stop offset="12%" stop-color="#f8fbff"/>
      <stop offset="24%" stop-color="#9aa3b0"/>
      <stop offset="42%" stop-color="#eef3fa"/>
      <stop offset="56%" stop-color="#bcc5d0"/>
      <stop offset="74%" stop-color="#7e8794"/>
      <stop offset="100%" stop-color="#c4ccd8"/>
    </linearGradient>
    <!-- 上下立体明暗 -->
    <linearGradient id="${id}-form" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="22%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.22)"/>
    </linearGradient>
    <linearGradient id="${id}-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aab2be"/>
      <stop offset="45%" stop-color="#7c8592"/>
      <stop offset="100%" stop-color="#565e6a"/>
    </linearGradient>
    <linearGradient id="${id}-edgeL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#9098a4"/><stop offset="100%" stop-color="#646c78"/>
    </linearGradient>
    <linearGradient id="${id}-edgeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#828a96"/><stop offset="100%" stop-color="#545c68"/>
    </linearGradient>
    <filter id="${id}-soft" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="0.9"/></filter>
  </defs>
  <path d="M0 82 H20 V96.5 Q20 100 17 100 H3 Q0 100 0 96.5 Z" fill="url(#${id}-front)"/>
  <rect x="0" y="82" width="1.3" height="18" fill="url(#${id}-edgeL)"/>
  <rect x="18.7" y="82" width="1.3" height="18" fill="url(#${id}-edgeR)"/>
  <rect x="0" y="0" width="20" height="82" fill="url(#${id}-top)"/>
  <rect x="0" y="0" width="20" height="82" fill="url(#${id}-form)"/>
  <!-- 斜向镜面高光 -->
  <polygon points="4,-2 7.5,-2 2.5,84 -1,84" fill="rgba(255,255,255,0.55)" filter="url(#${id}-soft)"/>
  <polygon points="13,-2 14.5,-2 11,84 9.5,84" fill="rgba(255,255,255,0.3)" filter="url(#${id}-soft)"/>
  <!-- 上沿亮边 -->
  <rect x="0" y="0" width="20" height="1.2" fill="rgba(255,255,255,0.7)"/>
  <line x1="20" y1="0" x2="20" y2="100" stroke="rgba(0,0,0,0.28)" stroke-width="0.5"/>
  <line x1="0" y1="82" x2="20" y2="82" stroke="rgba(0,0,0,0.18)" stroke-width="0.4"/>
  <line x1="0" y1="82.5" x2="20" y2="82.5" stroke="rgba(255,255,255,0.2)" stroke-width="0.3"/>
</svg>`
    }

    function whiteKeyPressedSvg(w, h) {
      const id = uid('mwp')
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 20 100" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="${id}-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7c8592"/>
      <stop offset="12%" stop-color="#bcc4d0"/>
      <stop offset="24%" stop-color="#6b7480"/>
      <stop offset="40%" stop-color="#aeb6c2"/>
      <stop offset="54%" stop-color="#828b98"/>
      <stop offset="70%" stop-color="#5a626e"/>
      <stop offset="86%" stop-color="#969fac"/>
      <stop offset="100%" stop-color="#6e7682"/>
    </linearGradient>
    <linearGradient id="${id}-form" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(0,0,0,0.28)"/>
      <stop offset="14%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.2)"/>
    </linearGradient>
    <linearGradient id="${id}-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e7682"/><stop offset="100%" stop-color="#454d58"/>
    </linearGradient>
    <linearGradient id="${id}-edgeL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#666e7a"/><stop offset="100%" stop-color="#4a525c"/>
    </linearGradient>
    <linearGradient id="${id}-edgeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e6672"/><stop offset="100%" stop-color="#424a54"/>
    </linearGradient>
  </defs>
  <path d="M0 87 H20 V96.5 Q20 100 17 100 H3 Q0 100 0 96.5 Z" fill="url(#${id}-front)"/>
  <rect x="0" y="87" width="1.3" height="13" fill="url(#${id}-edgeL)"/>
  <rect x="18.7" y="87" width="1.3" height="13" fill="url(#${id}-edgeR)"/>
  <rect x="0" y="0" width="20" height="87" fill="url(#${id}-top)"/>
  <rect x="0" y="0" width="20" height="87" fill="url(#${id}-form)"/>
  <rect x="0" y="84" width="20" height="3" fill="rgba(0,0,0,0.2)"/>
  <line x1="20" y1="0" x2="20" y2="100" stroke="rgba(0,0,0,0.32)" stroke-width="0.5"/>
  <line x1="0" y1="87" x2="20" y2="87" stroke="rgba(0,0,0,0.25)" stroke-width="0.5"/>
</svg>`
    }

    /* 黑键：暗铬合金，强反射带 + 镜面点高光 */
    function blackKeySvg(w, h) {
      const id = uid('mb')
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 12 60" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="${id}-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#3c424c"/>
      <stop offset="14%" stop-color="#838d9c"/>
      <stop offset="26%" stop-color="#20252c"/>
      <stop offset="42%" stop-color="#9aa4b4"/>
      <stop offset="52%" stop-color="#2a3038"/>
      <stop offset="68%" stop-color="#5a626e"/>
      <stop offset="84%" stop-color="#171b20"/>
      <stop offset="100%" stop-color="#3a4048"/>
    </linearGradient>
    <linearGradient id="${id}-form" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(220,235,255,0.35)"/>
      <stop offset="20%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </linearGradient>
    <linearGradient id="${id}-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#363c44"/><stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="${id}-edgeL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#3a3f48"/><stop offset="100%" stop-color="#1c2026"/>
    </linearGradient>
    <linearGradient id="${id}-edgeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e333a"/><stop offset="100%" stop-color="#16191e"/>
    </linearGradient>
    <filter id="${id}-soft" x="-40%" y="-10%" width="180%" height="120%"><feGaussianBlur stdDeviation="0.7"/></filter>
    <filter id="${id}-shadow" x="-20%" y="-10%" width="140%" height="135%">
      <feDropShadow dx="0" dy="0.9" stdDeviation="0.8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#${id}-shadow)">
    <path d="M0 46 H12 V57 Q12 59.5 10 59.5 H2 Q0 59.5 0 57 Z" fill="url(#${id}-front)"/>
    <rect x="0" y="46" width="0.9" height="13.5" fill="url(#${id}-edgeL)"/>
    <rect x="11.1" y="46" width="0.9" height="13.5" fill="url(#${id}-edgeR)"/>
    <rect x="0" y="0" width="12" height="46" fill="url(#${id}-top)"/>
    <rect x="0" y="0" width="12" height="46" fill="url(#${id}-form)"/>
    <polygon points="3,-1 4.6,-1 2,47 0.6,47" fill="rgba(225,240,255,0.6)" filter="url(#${id}-soft)"/>
    <circle cx="5" cy="6" r="0.9" fill="rgba(235,245,255,0.85)" filter="url(#${id}-soft)"/>
    <rect x="0" y="0" width="12" height="0.9" fill="rgba(210,230,255,0.4)"/>
    <line x1="0" y1="46" x2="12" y2="46" stroke="rgba(200,220,255,0.15)" stroke-width="0.35"/>
  </g>
</svg>`
    }

    function blackKeyPressedSvg(w, h) {
      const id = uid('mbp')
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 12 60" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="${id}-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#22262c"/>
      <stop offset="16%" stop-color="#4a525e"/>
      <stop offset="30%" stop-color="#121519"/>
      <stop offset="46%" stop-color="#586272"/>
      <stop offset="56%" stop-color="#181c22"/>
      <stop offset="74%" stop-color="#363c44"/>
      <stop offset="100%" stop-color="#1a1e24"/>
    </linearGradient>
    <linearGradient id="${id}-form" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(180,200,230,0.18)"/>
      <stop offset="20%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </linearGradient>
    <linearGradient id="${id}-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202329"/><stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="${id}-edgeL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#22262c"/><stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="${id}-edgeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2026"/><stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>
  <path d="M0 52 H12 V57 Q12 59.5 10 59.5 H2 Q0 59.5 0 57 Z" fill="url(#${id}-front)"/>
  <rect x="0" y="52" width="0.9" height="7.5" fill="url(#${id}-edgeL)"/>
  <rect x="11.1" y="52" width="0.9" height="7.5" fill="url(#${id}-edgeR)"/>
  <rect x="0" y="0" width="12" height="52" fill="url(#${id}-top)"/>
  <rect x="0" y="0" width="12" height="52" fill="url(#${id}-form)"/>
  <rect x="0" y="50" width="12" height="2.5" fill="rgba(0,0,0,0.35)"/>
  <line x1="0" y1="52" x2="12" y2="52" stroke="rgba(0,0,0,0.65)" stroke-width="0.55"/>
  <line x1="0" y1="52.5" x2="12" y2="52.5" stroke="rgba(190,210,245,0.08)" stroke-width="0.35"/>
</svg>`
    }

    const showcase = document.getElementById('showcase')
    const keyboard = document.getElementById('keyboard')
    const whiteWInput = document.getElementById('whiteW')
    const whiteHInput = document.getElementById('whiteH')
    const blackRatioInput = document.getElementById('blackRatio')

    function readParams() {
      return getKeySizes(+whiteWInput.value || 20, +whiteHInput.value || 100, +blackRatioInput.value || 0.6)
    }
    function renderShowcase() {
      const { white, black } = readParams()
      const items = [
        { title: '金属白键', fn: whiteKeySvg, size: white },
        { title: '金属白键（按下）', fn: whiteKeyPressedSvg, size: white },
        { title: '金属黑键', fn: blackKeySvg, size: black },
        { title: '金属黑键（按下）', fn: blackKeyPressedSvg, size: black },
      ]
      showcase.innerHTML = items.map(item => `
        <div class="card"><h3>${item.title}</h3>
          <div class="key-wrap">${item.fn(item.size.w, item.size.h)}</div>
          <span class="size-tag">${item.size.w.toFixed(1)} × ${item.size.h.toFixed(1)}</span>
        </div>`).join('')
    }
    const BLACK_LAYOUT = [{ after: 0 }, { after: 1 }, { after: 3 }, { after: 4 }, { after: 5 }]
    function renderKeyboard() {
      const { white, black } = readParams()
      let wh = '<div class="white-row">'
      for (let i = 0; i < 7; i++) wh += `<div class="white-slot" data-key="w${i}" data-type="white">${whiteKeySvg(white.w, white.h)}</div>`
      wh += '</div>'
      let bh = '<div class="black-row">'
      for (const b of BLACK_LAYOUT) {
        const left = (b.after + 1) * white.w - white.w * 0.5
        bh += `<div class="black-slot" data-key="b${b.after}" data-type="black" style="left:${left}px">${blackKeySvg(black.w, black.h)}</div>`
      }
      bh += '</div>'
      keyboard.innerHTML = wh + bh
      keyboard.style.height = white.h + 'px'
      keyboard.querySelectorAll('[data-key]').forEach(el => {
        const down = () => setKeyState(el, true), up = () => setKeyState(el, false)
        el.addEventListener('mousedown', down)
        el.addEventListener('mouseup', up)
        el.addEventListener('mouseleave', up)
        el.addEventListener('touchstart', e => { e.preventDefault(); down() }, { passive: false })
        el.addEventListener('touchend', up)
      })
    }
    function setKeyState(el, isPressed) {
      const { white, black } = readParams()
      const fns = el.dataset.type === 'white'
        ? [whiteKeySvg, whiteKeyPressedSvg, white.w, white.h]
        : [blackKeySvg, blackKeyPressedSvg, black.w, black.h]
      el.innerHTML = (isPressed ? fns[1] : fns[0])(fns[2], fns[3])
    }
    function render() { renderShowcase(); renderKeyboard() }
    ;[whiteWInput, whiteHInput, blackRatioInput].forEach(i => i.addEventListener('input', render))
    render()
    window.PianoKeySvg = { getKeySizes, whiteKeySvg, whiteKeyPressedSvg, blackKeySvg, blackKeyPressedSvg }
  </script>
</body>
</html>
