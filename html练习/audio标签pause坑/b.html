<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebAudio Segment Demo</title>
  <style>
      :root {
          --bg: #f6f3ee;
          --bg-accent: #efe1cf;
          --ink: #1b1a17;
          --accent: #c26b2c;
          --accent-dark: #8b4a20;
          --panel: rgba(255, 255, 255, 0.86);
          --border: rgba(27, 26, 23, 0.2);
      }

      * {
          box-sizing: border-box;
      }

      body {
          margin: 0;
          font-family: "Cambria", "Georgia", serif;
          color: var(--ink);
          min-height: 100vh;
          background:
                  radial-gradient(circle at 10% 20%, rgba(194, 107, 44, 0.18), transparent 55%),
                  radial-gradient(circle at 90% 10%, rgba(27, 26, 23, 0.08), transparent 40%),
                  repeating-linear-gradient(
                          135deg,
                          rgba(27, 26, 23, 0.03),
                          rgba(27, 26, 23, 0.03) 12px,
                          transparent 12px,
                          transparent 24px
                  ),
                  linear-gradient(160deg, var(--bg), var(--bg-accent));
          padding: 32px 20px 64px;
      }

      main {
          max-width: 860px;
          margin: 0 auto;
          padding: 32px;
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 20px;
          box-shadow: 0 18px 40px rgba(27, 26, 23, 0.14);
      }

      h1 {
          margin: 0 0 8px;
          font-size: clamp(2rem, 3vw, 2.6rem);
          letter-spacing: 0.02em;
      }

      p {
          margin: 0 0 24px;
          line-height: 1.6;
          color: rgba(27, 26, 23, 0.78);
      }

      .controls {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 16px;
          align-items: end;
      }

      label {
          display: grid;
          gap: 8px;
          font-size: 0.95rem;
          letter-spacing: 0.02em;
      }

      input[type="number"] {
          appearance: none;
          padding: 10px 12px;
          font-size: 1rem;
          border-radius: 10px;
          border: 1px solid var(--border);
          background: rgba(255, 255, 255, 0.9);
      }

      button {
          padding: 12px 18px;
          border-radius: 999px;
          border: 1px solid transparent;
          background: var(--accent);
          color: #fff;
          font-size: 0.95rem;
          cursor: pointer;
          transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button.secondary {
          background: transparent;
          color: var(--accent-dark);
          border-color: var(--accent-dark);
      }

      button:active {
          transform: translateY(1px);
      }

      button:disabled {
          cursor: not-allowed;
          opacity: 0.6;
      }

      .actions {
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
      }

      .meta {
          margin-top: 20px;
          padding: 16px;
          border-radius: 12px;
          background: rgba(27, 26, 23, 0.04);
          display: grid;
          gap: 8px;
          font-size: 0.92rem;
      }

      .status {
          font-weight: 600;
      }

      .status.error {
          color: #a12f1d;
      }
  </style>
</head>
<body>
<main>
  <h1>WebAudio Segment Player</h1>
  <p>
    Play a slice of <code>resources/audios/fanchang.mp3</code> with the Web
    Audio API. Adjust the start and end times to audition a segment.
  </p>

  <section class="controls">
    <label>
      Start (seconds)
      <input id="startTime" type="number" min="0" step="0.1" value="0" />
    </label>
    <label>
      End (seconds)
      <input id="endTime" type="number" min="0" step="0.1" placeholder="auto" />
    </label>
    <div class="actions">
      <button id="playBtn">Play Segment</button>
      <button id="stopBtn" class="secondary" type="button">Stop</button>
    </div>
  </section>

  <div class="meta">
    <div>Audio file: <span id="audioPath"></span></div>
    <div>Duration: <span id="duration">--</span> sec</div>
    <div>
      Status: <span id="status" class="status">Ready</span>
    </div>
  </div>
  <audio id="audioPlayer" preload="metadata"></audio>
</main>

<script>
  const audioUrl = "../resources/audios/fanchang.mp3";
  const audio = document.getElementById("audioPlayer");
  const startInput = document.getElementById("startTime");
  const endInput = document.getElementById("endTime");
  const playBtn = document.getElementById("playBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusEl = document.getElementById("status");
  const durationEl = document.getElementById("duration");
  const audioPathEl = document.getElementById("audioPath");

  audioPathEl.textContent = audioUrl;
  audio.src = audioUrl;
  audio.preload = "metadata";

  // Edit these values to change the default segment (in seconds).
  const defaultSegment = {
    start: 0,
    end: 12,
  };

  if (Number.isFinite(defaultSegment.start)) {
    startInput.value = defaultSegment.start;
  }
  if (Number.isFinite(defaultSegment.end)) {
    endInput.value = defaultSegment.end;
  }

  let stopAt = null;

  const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

  const setStatus = (message, isError = false) => {
    statusEl.textContent = message;
    statusEl.classList.toggle("error", isError);
  };

  const stopCurrent = () => {
    stopAt = null;
    audio.pause();
  };

  const updateDuration = () => {
    if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
      return;
    }
    const duration = audio.duration;
    durationEl.textContent = duration.toFixed(2);
    endInput.max = duration.toFixed(2);
    startInput.max = duration.toFixed(2);

    const currentStart = Number.parseFloat(startInput.value);
    const currentEnd = Number.parseFloat(endInput.value);
    if (Number.isFinite(currentStart)) {
      startInput.value = clamp(currentStart, 0, duration).toFixed(2);
    }
    if (Number.isFinite(currentEnd) && currentEnd > 0) {
      endInput.value = clamp(currentEnd, 0, duration).toFixed(2);
    } else {
      endInput.value = duration.toFixed(2);
    }
  };

  const ensureMetadata = () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      const handleLoaded = () => {
        cleanup();
        resolve();
      };
      const handleError = () => {
        cleanup();
        reject(new Error("Failed to load audio metadata."));
      };
      const cleanup = () => {
        audio.removeEventListener("loadedmetadata", handleLoaded);
        audio.removeEventListener("error", handleError);
      };
      audio.addEventListener("loadedmetadata", handleLoaded);
      audio.addEventListener("error", handleError);
      audio.load();
    });
  };

  const handleTimeUpdate = () => {
    if (stopAt === null) {
      return;
    }
    if (audio.currentTime >= stopAt) {
      audio.pause();
      audio.currentTime = stopAt;
      stopAt = null;
      setStatus("Finished.");
    }
  };

  audio.addEventListener("loadedmetadata", updateDuration);
  audio.addEventListener("durationchange", updateDuration);
  audio.addEventListener("timeupdate", handleTimeUpdate);
  audio.addEventListener("ended", () => {
    stopAt = null;
    setStatus("Finished.");
  });
  audio.addEventListener("error", () => {
    setStatus("Error: unable to load audio.", true);
  });

  playBtn.addEventListener("click", async () => {
    playBtn.disabled = true;
    try {
      setStatus("Loading audio...");
      await ensureMetadata();
      updateDuration();
      const duration = audio.duration;
      const startValue = Number.parseFloat(startInput.value);
      const endValue = Number.parseFloat(endInput.value);
      const startTime = Number.isFinite(startValue) ? startValue : 0;
      const endTime = Number.isFinite(endValue) && endValue > 0 ? endValue : duration;

      const clampedStart = clamp(startTime, 0, duration);
      const clampedEnd = clamp(endTime, clampedStart, duration);
      const segmentDuration = clampedEnd - clampedStart;

      if (segmentDuration <= 0.01) {
        setStatus("End time must be greater than start time.", true);
        return;
      }

      stopCurrent();

      audio.currentTime = clampedStart;
      stopAt = clampedEnd;
      await audio.play();
      setStatus(
        `Playing ${clampedStart.toFixed(2)}s - ${clampedEnd.toFixed(2)}s`
      );
    } catch (err) {
      setStatus("Error: unable to play audio.", true);
      console.error(err);
    } finally {
      playBtn.disabled = false;
    }
  });

  stopBtn.addEventListener("click", () => {
    stopCurrent();
    setStatus("Stopped.");
  });
</script>
</body>
</html>
