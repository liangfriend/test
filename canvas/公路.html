<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公路</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #c8e8ff; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas')
    const ctx = canvas.getContext('2d')
    const dpr = Math.min(devicePixelRatio || 1, 2)

    let w, h, offset = 0
    let clouds = [], trees = [], flowers = []

    const ROAD_RATIO = 0.8

    function rand(a, b) { return a + Math.random() * (b - a) }

    function roadTop() { return h * 0.5 - (h * ROAD_RATIO) / 2 }
    function roadBot() { return h * 0.5 + (h * ROAD_RATIO) / 2 }

    function resize() {
      w = innerWidth
      h = innerHeight
      canvas.width = w * dpr
      canvas.height = h * dpr
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      initDecor()
    }

    function initDecor() {
      clouds = []
      trees = []
      flowers = []

      for (let i = 0; i < 8; i++) {
        clouds.push({
          x: Math.random() * w * 1.5,
          y: rand(h * 0.06, h * 0.28),
          s: rand(0.7, 1.4),
          speed: rand(0.08, 0.2),
        })
      }

      for (let i = 0; i < 16; i++) {
        trees.push({
          x: Math.random() * w * 2,
          side: Math.random() < 0.5 ? 'top' : 'bot',
          s: rand(0.6, 1.1),
        })
      }

      for (let i = 0; i < 30; i++) {
        flowers.push({
          x: Math.random() * w * 2,
          side: Math.random() < 0.5 ? 'top' : 'bot',
          offY: rand(12, 30),
          color: ['#ff9ecf', '#ffd166', '#a8e6cf', '#c9b1ff', '#ffab91'][i % 5],
          s: rand(0.5, 1),
        })
      }
    }

    function drawSky() {
      const g = ctx.createLinearGradient(0, 0, 0, h)
      g.addColorStop(0, '#b8e4ff')
      g.addColorStop(0.55, '#d4f0ff')
      g.addColorStop(1, '#e8fff0')
      ctx.fillStyle = g
      ctx.fillRect(0, 0, w, h)
    }

    function drawCloud(c) {
      const { x, y, s } = c
      ctx.fillStyle = 'rgba(255,255,255,0.92)'
      const blobs = [
        [0, 0, 28], [22, -6, 22], [-20, -4, 20], [12, 8, 18], [-14, 6, 16],
      ]
      for (const [bx, by, br] of blobs) {
        ctx.beginPath()
        ctx.arc(x + bx * s, y + by * s, br * s, 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.fillStyle = 'rgba(255,255,255,0.5)'
      ctx.beginPath()
      ctx.ellipse(x, y + 10 * s, 38 * s, 10 * s, 0, 0, Math.PI * 2)
      ctx.fill()
    }

    function drawGrassBand(y0, y1, flip) {
      const g = ctx.createLinearGradient(0, y0, 0, y1)
      if (flip) {
        g.addColorStop(0, '#9ee89a')
        g.addColorStop(1, '#7ed67a')
      } else {
        g.addColorStop(0, '#7ed67a')
        g.addColorStop(1, '#9ee89a')
      }
      ctx.fillStyle = g
      ctx.fillRect(0, y0, w, y1 - y0)

      ctx.fillStyle = '#8ed88a'
      const bumps = Math.ceil(w / 120) + 2
      for (let i = -1; i < bumps; i++) {
        const bx = ((i * 120 - (offset * 0.3) % 120) + w * 2) % (w + 120) - 60
        const by = flip ? y0 + 8 : y1 - 8
        ctx.beginPath()
        ctx.arc(bx, by, 50, flip ? Math.PI : 0, flip ? Math.PI * 2 : 0, !flip)
        ctx.fill()
      }
    }

    function drawRoad() {
      const rt = roadTop()
      const rb = roadBot()
      const r = 12

      ctx.fillStyle = '#6b7288'
      ctx.beginPath()
      ctx.roundRect(-2, rt, w + 4, rb - rt, r)
      ctx.fill()

      ctx.fillStyle = '#848b9c'
      ctx.beginPath()
      ctx.roundRect(6, rt + 5, w - 12, rb - rt - 10, r - 4)
      ctx.fill()

      ctx.strokeStyle = '#fff8f0'
      ctx.lineWidth = 4
      ctx.lineCap = 'round'
      ctx.beginPath()
      ctx.moveTo(0, rt + 8)
      ctx.lineTo(w, rt + 8)
      ctx.moveTo(0, rb - 8)
      ctx.lineTo(w, rb - 8)
      ctx.stroke()

      const cy = (rt + rb) / 2
      const dashW = 36
      const gap = 28
      const total = dashW + gap
      const scroll = offset % total
      for (let x = -total; x < w + total; x += total) {
        const dx = x + scroll
        ctx.fillStyle = '#ffe566'
        ctx.beginPath()
        ctx.roundRect(dx, cy - 3, dashW, 6, 3)
        ctx.fill()
      }
    }

    function drawTree(t) {
      const tx = ((t.x - offset * 0.5) % (w * 2) + w * 2) % (w * 2)
      if (tx < -40 || tx > w + 40) return

      const rt = roadTop()
      const rb = roadBot()
      const baseY = t.side === 'top' ? rt - 6 : rb + 6
      const s = t.s

      ctx.fillStyle = '#c49a6c'
      ctx.beginPath()
      ctx.roundRect(tx - 5 * s, baseY + (t.side === 'top' ? -22 * s : 0), 10 * s, 22 * s, 4)
      ctx.fill()

      const crownY = t.side === 'top' ? baseY - 28 * s : baseY + 28 * s
      ctx.fillStyle = '#6ecf8a'
      ctx.beginPath()
      ctx.arc(tx, crownY, 22 * s, 0, Math.PI * 2)
      ctx.fill()
      ctx.fillStyle = '#8ae6a0'
      ctx.beginPath()
      ctx.arc(tx - 10 * s, crownY + (t.side === 'top' ? 4 : -4) * s, 14 * s, 0, Math.PI * 2)
      ctx.arc(tx + 12 * s, crownY + (t.side === 'top' ? 6 : -6) * s, 12 * s, 0, Math.PI * 2)
      ctx.fill()
    }

    function drawFlower(f) {
      const fx = ((f.x - offset * 0.35) % (w * 2) + w * 2) % (w * 2)
      if (fx < -10 || fx > w + 10) return

      const rt = roadTop()
      const rb = roadBot()
      const fy = f.side === 'top' ? rt - f.offY : rb + f.offY
      const s = f.s

      ctx.fillStyle = '#7ed67a'
      ctx.fillRect(fx, f.side === 'top' ? fy + 4 * s : fy - 8 * s, 2, 8 * s)

      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2
        ctx.fillStyle = f.color
        ctx.beginPath()
        ctx.arc(fx + Math.cos(a) * 5 * s, fy + Math.sin(a) * 5 * s, 4 * s, 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.fillStyle = '#fff5a0'
      ctx.beginPath()
      ctx.arc(fx, fy, 3 * s, 0, Math.PI * 2)
      ctx.fill()
    }

    function draw() {
      drawSky()

      for (const c of clouds) drawCloud(c)

      drawGrassBand(0, roadTop(), false)
      drawGrassBand(roadBot(), h, true)

      for (const f of flowers) drawFlower(f)
      for (const t of trees) drawTree(t)

      drawRoad()
    }

    function update() {
      offset += 1.2
      for (const c of clouds) {
        c.x += c.speed
        if (c.x > w + 80) c.x = -80
      }
    }

    function frame() {
      update()
      draw()
      requestAnimationFrame(frame)
    }

    window.addEventListener('resize', resize)
    resize()
    requestAnimationFrame(frame)
  </script>
</body>
</html>
