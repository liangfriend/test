<body>
<div class="container" id="container">
  <div class="middle"><div class="symbol" id="symbol"></div></div>
</div>
<p>top: <input type="number" id="topInput" value="0" /></p>
</body>
<style>
  .container {
    width: 300px;
    height: 300px;
    outline: 1px solid black;
    position: relative;
  }

  .symbol {
    width: 20px;
    height: 20px;
    background-color: red;
    position: absolute;
  }
  .middle {
    width: 20px;
    height:300px;
    outline: 1px solid black;
  }
</style>

<script>
  const container = document.getElementById('container');
  const symbol = document.getElementById('symbol');
  const topInput = document.getElementById('topInput');

  // 唯一数据源
  let top = 0;

  // 数据 → 视图（写一个函数，两处都用）
  function apply() {
    symbol.style.top = top + 'px';
    topInput.value = top;
  }

  // 输入框变化 → 数据 → 视图
  topInput.addEventListener('input', () => {
    top = +topInput.value || 0;
    apply();
  });

  let lock = false;
  container.addEventListener('mousedown', () => { lock = true; });
  container.addEventListener('mouseup', () => { lock = false; });

  container.addEventListener('mousemove', (e) => {
    if (!lock) return;
    const rect = container.getBoundingClientRect();
    top = Math.round(e.clientY - rect.top - symbol.offsetHeight / 2);
    apply();
  });

  apply(); // 初始化
</script>
